<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eRECEIVE Verify</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f3f4f6;
}
.header{
    background:white;
    padding:20px;
    text-align:center;
    border-bottom:1px solid #ddd;
}
.header img{
    height:60px;
}
.nav{
    background:#a0004f;
    color:white;
    padding:15px;
    font-weight:bold;
}
.container{
    max-width:500px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
h1{
    font-size:26px;
}
label{
    display:block;
    margin-top:20px;
    font-weight:bold;
}
input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-bottom:2px solid #ccc;
    outline:none;
}
.recaptcha{
    margin-top:20px;
    border:1px solid #ccc;
    padding:15px;
    display:flex;
    align-items:center;
    gap:10px;
}
button{
    margin-top:20px;
    width:100%;
    padding:12px;
    background:#003366;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}
#error{
    color:red;
    text-align:center;
    margin-top:15px;
}
#certificateBox{
    display:none;
    text-align:center;
    margin-top:20px;
}
#certificateBox img{
    width:100%;
    border-radius:10px;
    margin-bottom:15px;
}
.downloadBtn{
    display:inline-block;
    padding:10px 20px;
    background:#003366;
    color:white;
    border-radius:5px;
    text-decoration:none;
    margin-bottom:15px;
}
</style>
</head>

<div class="container">
    <h1>eRECEIVE: Verify Certificate of Death</h1>

    <p>Please provide the following information.</p>

    <label>Certificate No.</label>
    <input type="text" id="cert" placeholder="Enter certificate number">

    <label>Access Code</label>
    <input type="text" id="code" placeholder="Enter access code">

    <div class="recaptcha">
        <input type="checkbox" id="robotCheck">
        <span>I'm not a robot</span>
    </div>

    <button onclick="verify()">Verify</button>

    <div id="error"></div>

    <!-- Certificate container -->
    <div id="certificateBox">
        <h2>Certificate Verified ✅</h2>
        <!-- Preview image -->
        <img src="DEATH SNG.pdf" alt="DEATH SNG.pdf">
        <br>
        <!-- Smart download button -->
        <a class="downloadBtn" href="DEATH SNG.pdf" download="DEATH SNG.pdf" ><button>⬇ Download PDF </button></a>
        <br>
        <a href="DEATH SNG.pdf" onclick="hideCertificate()">⬅ Back</a>
    </div>

</div>

<script>
function verify() {
    let cert = document.getElementById("cert").value;
    let code = document.getElementById("code").value;
    let robot = document.getElementById("robotCheck").checked;
    let error = document.getElementById("error");
    let box = document.getElementById("certificateBox");

    error.innerText = "";
    box.style.display = "none";

    if(cert === "419391A" && code === "189630" && robot) {
        box.style.display = "block"; // show certificate
    } else {
        error.innerText = "Invalid Certificate Number or Access Code ❌";
    }
}

// Back button hides certificate
function hideCertificate() {
    document.getElementById("certificateBox").style.display = "none";
}
</script>
